spring.application.name=FlagMan

# Load .env from the project root when running on the host (IDE or ./mvnw).
# Real environment variables (e.g. set by Docker Compose) take precedence.
spring.config.import=optional:file:.env[.properties]

# DB_PARAMS adds connection options, e.g. ?sslMode=VERIFY_IDENTITY for a hosted database that requires TLS (TiDB Cloud).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:feature_flag_system}${DB_PARAMS:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

server.port=8081

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Off: with it on, every request keeps a database connection until it ends, and a stream request never
# ends, so ten open streams used up the whole pool and every other request hung.
spring.jpa.open-in-view=false

# Browser origins allowed to call the API (comma-separated, no trailing slash).
flagman.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Every change (create, update, delete) needs this key in the X-Admin-Key header, except the preset changes a
# sandbox token may make on its own sandbox. Empty = no key needed (local development only). At least 32 characters.
flagman.admin-key=${FLAGMAN_ADMIN_KEY:}

# Proxies in front of FlagMan that append to X-Forwarded-For (e.g. 1 on Render); 0 = none. Used for per-IP rate limits.
flagman.trusted-proxies=${FLAGMAN_TRUSTED_PROXIES:0}

# Open streams allowed per IP. Docker Desktop's port forwarding keeps closed connections open, so the local
# Compose setup raises this; a host like Render reports closed connections and keeps the default.
flagman.max-streams-per-ip=${FLAGMAN_MAX_STREAMS_PER_IP:10}

# Sandboxes (POST /sandboxes): a private copy of the demo flags per visitor. A sandbox token may only switch these
# flags in this environment, set their rollout, and add or remove the rules below.
flagman.sandbox.environment=DEV
flagman.sandbox.flags=dark-mode,hide-non-fiction
flagman.sandbox.max-total=${FLAGMAN_SANDBOX_MAX:5000}
flagman.sandbox.idle-timeout=24h
flagman.sandbox.allowed-rules[0].attribute=country
flagman.sandbox.allowed-rules[0].operator=NOT_EQUALS
flagman.sandbox.allowed-rules[0].values[0]=US
flagman.sandbox.allowed-rules[0].values[1]=IN
flagman.sandbox.allowed-rules[0].values[2]=GB
flagman.sandbox.allowed-rules[1].attribute=country
flagman.sandbox.allowed-rules[1].operator=IN
flagman.sandbox.allowed-rules[1].values[0]=IN,GB
flagman.sandbox.allowed-rules[1].values[1]=IN
flagman.sandbox.allowed-rules[1].values[2]=GB
flagman.sandbox.allowed-rules[1].values[3]=US
flagman.sandbox.allowed-rules[2].attribute=plan
flagman.sandbox.allowed-rules[2].operator=EQUALS
flagman.sandbox.allowed-rules[2].values[0]=pro
flagman.sandbox.allowed-rules[2].values[1]=free
