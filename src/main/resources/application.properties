spring.application.name=FlagMan

# Load .env from the project root when running on the host (IDE or ./mvnw).
# Real environment variables (e.g. set by Docker Compose) take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:feature_flag_system}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

server.port=8081

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
