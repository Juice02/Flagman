server {
    listen 80;
    root /usr/share/nginx/html;

    # Same path as the Vite dev proxy, so the dashboard never makes a cross-origin call.
    location /api/ {
        proxy_pass http://app:8081/;
        # Keep the browser's Host so Spring sees Origin and Host match (same-origin), not a CORS request.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
