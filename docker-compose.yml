name: flagman

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-feature_flag_system}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-feature_flag_system}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FLAGMAN_ADMIN_KEY: ${FLAGMAN_ADMIN_KEY:-}
      FLAGMAN_TRUSTED_PROXIES: ${FLAGMAN_TRUSTED_PROXIES:-0}
      # Docker Desktop keeps closed connections open, so local reloads would hit the default cap of 10.
      FLAGMAN_MAX_STREAMS_PER_IP: ${FLAGMAN_MAX_STREAMS_PER_IP:-1000}
    ports:
      - "${APP_PORT:-8081}:8081"

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${DASHBOARD_PORT:-8080}:80"

volumes:
  mysql_data:
